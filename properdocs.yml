site_name: HYW-Wiki
site_url: https://hyw.lolic0n.top/
repo_url: https://github.com/trailblazer-forward/hyw-wiki
repo_name: hyw-wiki
copyright: 'Copyright &copy; 2026 HYW-Wiki Team'
nav:
  - 首页: index.md
  - 化学:
    - 简介: chemistry/intro.md
    - 原子结构: chemistry/atomic-structure.md
  - 施工列表: in-production.md
theme:
  name: material
  custom_dir: overrides
  favicon: favicon.ico
  icon:
    logo: material/school
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
plugins:
  - meta
markdown_extensions:
  - toc:
      permalink: True
      permalink_title: Anchor link to this section for reference
      slugify: !!python/object/apply:pymdownx.slugs.slugify {}
      baselevel: 2
  - mkdocs_graphviz
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra:
  copyright: '<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh">CC BY-SA 4.0</a> 和 <a href="https://github.com/zTrix/sata-license">SATA</a>'
extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/mhchem.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/copy-tex.min.js
extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
